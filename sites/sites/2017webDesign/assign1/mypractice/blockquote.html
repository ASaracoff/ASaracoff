<!DOCTYPE html>
	<html lang="en">
		<head>
			<title>Blockquote</title>
			<meta charset="utf-8">
		</head>
		<body>
			<h1>The Power of the Web</h1>
			<p>According to Tim Berners-Lee, the invention of the Word Wide Web, at http//:www.w3c.org/WAI/:
			</p>
			<blockquote>
				The power of the Web is in its universality. <em>Access by everyone</em> regardless of disability is an essential aspect.
			</blockquote>
		</body>
	</html>
