        <main>
            <h2>Contact Path of Light Yoga Studios</h2>
            <form name="contact" method="post" id="contact" action="http://www.webdevbasics.net/scripts/yoga.php">
                <label for="myFName">*First Name:</label>
                <input type="text" name="myFName" id="myFName" required="required">
                <label for="myLName">*Last Name:</label>
                <input type="text" name="myLName" id="myLName" required="required">
                <label for="myEmail">*E-mail:</label>
                <input type="email" name="myEmail" id="myEmail" required="required">
                <label for="question">How did you hear about us?</label>
                <input type="text" name="question" id="question">
                <label for="myComments">*Comments:</label>
                <textarea type="text" name="myComments" id="myComments" rows="2" cols="20"></textarea>
                <input type="submit" value="Send Now">
            </form>
            
        </main>
