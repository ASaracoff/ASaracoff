<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Maker</title>
    <script src="logoMaker.js" defer></script>
</head>
<body>
    <h1>Logo Maker</h1>
    <form action="" id="logoForm">
        <p>Insert Brand Name: <input type="text" placeholder="Brand Name" name="brandName"></p>
        <p>Pick Color: 
        <input type="color" name="color"></p>
        <p>Choose Size: 
        <input type="range" name="size" min="10" max="200"></p>
        <input type="submit" name="submit">
    </form>
    <section id="results">

    </section>

</body>
</html>
