<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="quoteGen.css">
    <script src="quoteGen.js" defer></script>
    <title>API Quote Generator</title>
</head>
<body>
    <div class="container">
        <h1>API Quote Generator</h1>
        <div class="quote-box">
            <p class="quote"> And He said to me, ‘My grace is sufficient for you, for My strength is made perfect in weakness.’ Therefore most gladly I will rather boast in my infirmities, that the power of Christ may rest upon me.</p>
            <p class="author">
                <span>--</span>
                <span class="name">2 Corinthians 12:9</span>
            </p>
        </div>
        <!-- quote generator button-->
        <button class="quote-btn" onclick="getQuote(quoteAPIUrl)">Get New Quote</button>

    </div>
</body>
</html>
