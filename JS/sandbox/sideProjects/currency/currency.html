<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="currency.css">
    <script src="currency.js" defer></script>
    <title>Currency Converter API</title>
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <div class="currency-container">
            <!-- list of currencies -->
            <select id="currency-first">
                <option value="">Select</option>
                <option value="USD">USD</option>
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR">INR</option>
                <option value="JPY">JPY</option>
            </select>
            <!-- USER input # value -->
             <input type="number" id="worth-first" value="1" min="0">
        </div>
        <div class="currency-container">
            <!-- list of currencies -->
            <select id="currency-second">
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="EUR" selected>EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR">INR</option>
                <option value="JPY">JPY</option>
                <option value="USD">USD</option>
            </select>
            <!-- view only input # value -->
             <input type="number" id="worth-second" disabled>
        </div>
        <p id="exchange-rate">  </p>
    </div>
</body>
</html>
