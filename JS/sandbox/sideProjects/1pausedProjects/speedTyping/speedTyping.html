<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing</title>
    <link rel="stylesheet" href="speedTyping.css">
    <script src="speedTyping.js" defer></script>
</head>
<body>
    
    <!-- timer -->
    <div class="timer" id="timer">0</div>

    <!-- container - everything in yellow box -->
     <div class="container">
        <!-- the quote to copy -->
        <div class="quote-display" id="quoteDisplay">quote</div>
        <!-- where to type the quote - autofocus = when pg loads focus here! -->
        <textarea id="quoteInput" class="quote-input" autofocus>quote</textarea>
     </div>
    
</body>
</html>
