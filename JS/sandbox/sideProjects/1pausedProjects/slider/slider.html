<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- linking Google fonts for icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward" />
    <title>Slider</title>
    <link rel="stylesheet" href="slider.css">
</head>
<body>
    
    <!-- container for slider -->
    <div class="container">
        <!-- shortcut key div.class fills in the code -->
        <div class="card-wrapper">
            <ul class="card-list">
                <li class="card-item">
                    <a href="" class="card-link">
                        <!-- display card image -->
                        <img src="images/developer.jpg" alt="Card Image" class="card-image">
                    </a>
                    <!-- badge info -->
                    <p class="badge"> Developer </p>
                    <h2 class="card-title"> Lorem ipsum dolor sit amet consectetur adipisicing elit.</h2>
                    <!-- google font arrow - changed to button -->
                    <button class="card-button material-symbols-outlined"> arrow_forward
                        
                    </button>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
