<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="infiniteCarousel.css">
    <script src="infiniteCarousel.js" defer></script>
    <title>Infinite Carousel</title>
</head>
<body>
    <h1>Infinite Carousel</h1>
    <!-- div.carousel>div.group>div.card{$}*6 -->
    <div class="carousel">
        <div class="group">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
            <div class="card">6</div>
        </div>
        <!-- duplicate group: aria-hidden hides the visual(?) -->
         <div aria-hidden class="group">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
            <div class="card">6</div>
        </div>
    </div>
</body>
</html>
