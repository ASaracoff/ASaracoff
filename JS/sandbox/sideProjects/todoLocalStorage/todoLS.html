<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todoLS.css">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Inter:opsz,wght@14..32,100..900&family=Quintessential&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<!-- script -->
    <script src="todoLS.js" defer></script>
    <title>To Do</title>
</head>
<body>
    <main>
        <h1>My Todo list...</h1>
        <div class="input-header">
            <h1><span id="date"></span></h1>
            <div class="to-do-input">
                <input type="text" id="item" placeholder="Enter a task"><button id="enter">Enter</button>
            </div>
        </div>

        <!-- to do list items -->
        <div class="to-do-list"></div>    

    </main>
    
</body>
</html>
